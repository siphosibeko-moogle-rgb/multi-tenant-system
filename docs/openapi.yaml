openapi: 3.1.0

# =====================================================================
# Multi-tenant Inventory Management API — v1 contract
#
# Conventions that hold everywhere:
#   * tenant_id NEVER appears in a path, query or body. It is read from
#     the `tid` claim of the access token, server side. A client that
#     wants another tenant's data has no syntax available to ask for it.
#   * Cursor pagination (`cursor` + `limit`), not offset. Offsets skip
#     and duplicate rows when a list is being written to concurrently.
#   * Writes that create money-or-stock effects accept an
#     `Idempotency-Key` header. Mobile clients retry on flaky networks.
#   * Errors are RFC 9457 problem details, one shape everywhere.
#   * Timestamps are RFC 3339 with offset. Dates (business days) are
#     plain YYYY-MM-DD, resolved in the tenant's timezone.
# =====================================================================

info:
  title: Inventory Management API
  version: 1.0.0
  description: |
    Backend for a multi-tenant inventory platform for SMEs, consumed by an
    Android (Kotlin/Compose) client.
  license:
    name: Proprietary
    # SPDX identifier. OpenAPI 3.1 treats this as optional, but swagger-parser
    # reports its absence, and the alternative — teaching ApiContractTest to
    # ignore parser messages — would also silence the dangling-$ref detection
    # that makes the check worth having. LicenseRef-* is the SPDX form for a
    # licence that is not on the SPDX list. Mutually exclusive with license.url,
    # which is why there is no url here.
    identifier: LicenseRef-Proprietary

servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Authentication
  - name: Users
  - name: Catalog
  - name: Suppliers
  - name: Inventory
  - name: Sales
  - name: Purchasing
  - name: Forecasting
  - name: Reports
  - name: Sync

paths:

  # ------------------------------------------------------------------
  # Authentication
  # ------------------------------------------------------------------
  # DECISIONS ON RECORD for /auth/register-tenant (M1)
  #
  # 409 on a taken slug DELIBERATELY DISCLOSES that a tenant with that slug
  # exists. Accepted, not accidental:
  #   * it is the same disclosure any username-availability check makes, and
  #     the slug is a public identifier by design;
  #   * registration cannot pre-check availability anyway — it runs bound to a
  #     brand-new tenant id, so RLS hides the conflicting row. The UNIQUE index
  #     on tenants.slug is enforced physically, independent of RLS, which is why
  #     the collision surfaces at all;
  #   * the alternative is a silent failure that leaves the user unable to
  #     register and unable to find out why.
  # A primary-key collision returns the SAME 409 with the same body, so a caller
  # cannot distinguish the two or use it to confirm a guessed tenant id.
  #
  # The tenant id is generated server-side and is NEVER read from the request.
  # TenantRegistrationRequest has no field for one; a client that sends
  # tenantId/tenant_id/id anyway is ignored. See CLAUDE.md section 12.
  #
  # RATE LIMITED from M1, not M9: this endpoint is unauthenticated and creates
  # rows. Over the limit returns 429 with Retry-After. Per instance, not per
  # cluster — see AuthRateLimiter.
  /auth/register-tenant:
    post:
      tags: [Authentication]
      summary: Sign up a new business and its first owner account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantRegistrationRequest' }
      responses:
        '201':
          description: Tenant and owner created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Authentication]
      summary: Exchange credentials for an access + refresh token pair
      description: |
        Email is unique per tenant, not globally, so `tenantSlug` disambiguates.
        If it is omitted and the email resolves to exactly one tenant, that
        tenant is used; if it resolves to several, the response is 300 with the
        candidate list so the client can prompt. Never reveal whether an email
        exists on a failed login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '300':
          description: Email belongs to multiple tenants; pick one
          content:
            application/json:
              schema:
                type: object
                required: [tenants]
                properties:
                  tenants:
                    type: array
                    items: { $ref: '#/components/schemas/TenantSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate a refresh token
      description: |
        Refresh tokens are single-use and rotated. Presenting an already-used
        token invalidates the whole token family — that is the signal of a
        stolen token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current refresh token, or every session
      description: |
        Requires an access token — this is the one /auth endpoint without
        `security: []`, and the implementation matches.

        With a refresh token in the body, revokes that session ("sign out this
        device"). With no body, revokes every live refresh token for the
        authenticated user ("sign out everywhere").

        Always 204, whether or not the token was still live. Reporting "already
        revoked" would make logout an oracle for whether a stolen token works.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me:
    get:
      tags: [Users]
      summary: Current user, role and tenant settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }

  # ------------------------------------------------------------------
  # Users
  #
  # Read is owner + manager. Every MUTATION is owner-only.
  #
  # This header previously read "owner/manager only", which contradicted the
  # UserRole schema below — that gives "users" to owner and lists manager as
  # "catalog, purchasing, reports, adjustments", without users. UserRole is the
  # source of truth; this header was the half that was wrong.
  #
  # Mutations are owner-only because POST /users and PATCH /users/{userId} both
  # take a role. A manager holding either has a one-call path to owner — invite
  # an owner account, or promote themselves — so a manager who could write here
  # could take over the business. Reading the team grants nothing, so it stays
  # open to manager.
  #
  # Enforced by @PreAuthorize in UsersController and asserted both ways (allow
  # AND deny, per role) in RoleEnforcementTest.
  # ------------------------------------------------------------------
  /users:
    get:
      tags: [Users]
      summary: List users in the tenant
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [invited, active, disabled] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
    post:
      tags: [Users]
      summary: Invite a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInviteRequest' }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{userId}:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    patch:
      tags: [Users]
      summary: Change a user's role or status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
                status: { type: string, enum: [active, disabled] }
                fullName: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      summary: Deactivate a user (soft delete)
      responses:
        '204': { description: Deactivated }
        '409':
          $ref: '#/components/responses/Conflict'

  # ------------------------------------------------------------------
  # Catalog
  # ------------------------------------------------------------------
  /products:
    get:
      tags: [Catalog]
      summary: Search and list products
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Free-text match on name, SKU or barcode
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: stockState
          in: query
          description: Filter by computed stock state
          schema: { type: string, enum: [ok, reorder, out_of_stock, unknown] }
        - name: active
          in: query
          schema: { type: boolean, default: true }
        - name: sort
          in: query
          schema: { type: string, enum: [name, sku, -updatedAt, quantityOnHand], default: name }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [Catalog]
      summary: Create a product
      description: |
        `openingStock` is optional sugar: when present the server posts an
        `opening_balance` movement so the ledger stays the only way stock
        ever changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductWriteRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '409':
          description: SKU or barcode already used in this tenant
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /products/{productId}:
    parameters: [ { $ref: '#/components/parameters/ProductId' } ]
    get:
      tags: [Catalog]
      summary: Get one product with stock and current forecast
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Opaque version, send back as If-Match on update
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Catalog]
      summary: Update a product
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductWriteRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [Catalog]
      summary: Archive a product (soft delete; history is preserved)
      responses:
        '204': { description: Archived }

  /products/lookup:
    get:
      tags: [Catalog]
      summary: Resolve a scanned barcode to a product
      description: Hot path for the Android scanner; kept separate so it can be cached hard.
      parameters:
        - name: barcode
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }

  /categories:
    get:
      tags: [Catalog]
      summary: List categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Catalog]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parentId: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }

  /locations:
    get:
      tags: [Catalog]
      summary: List stock locations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Location' }
    post:
      tags: [Catalog]
      summary: Create a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                address: { type: string }
                isDefault: { type: boolean, default: false }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }

  # ------------------------------------------------------------------
  # Suppliers
  # ------------------------------------------------------------------
  /suppliers:
    get:
      tags: [Suppliers]
      summary: List suppliers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Supplier' }
    post:
      tags: [Suppliers]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierWriteRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }

  /suppliers/{supplierId}:
    parameters: [ { $ref: '#/components/parameters/SupplierId' } ]
    get:
      tags: [Suppliers]
      summary: Get a supplier, including observed lead time performance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Suppliers]
      summary: Update a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierWriteRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }

  /products/{productId}/suppliers:
    parameters: [ { $ref: '#/components/parameters/ProductId' } ]
    get:
      tags: [Suppliers]
      summary: Who can supply this product, at what cost and lead time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSupplier' }
    put:
      tags: [Suppliers]
      summary: Replace the supplier list for a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ProductSupplierWrite' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSupplier' }

  # ------------------------------------------------------------------
  # Inventory
  # ------------------------------------------------------------------
  /inventory:
    get:
      tags: [Inventory]
      summary: Stock status across products
      description: Backs the main inventory screen and the low-stock badge.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/LocationIdQuery'
        - name: stockState
          in: query
          schema: { type: string, enum: [ok, reorder, out_of_stock, unknown] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/StockStatus' }

  /inventory/movements:
    get:
      tags: [Inventory]
      summary: Read the stock ledger
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: productId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/LocationIdQuery'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/MovementType' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/StockMovement' }

  /inventory/adjustments:
    post:
      tags: [Inventory]
      summary: Correct stock (damage, theft, recount)
      description: |
        Appends an `adjustment` movement. There is deliberately no endpoint to
        set an absolute quantity or to edit a past movement — corrections are
        always new signed rows, so the audit trail cannot be rewritten.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequest' }
      responses:
        '201':
          description: Posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovement' }
        '409': { $ref: '#/components/responses/InsufficientStock' }

  /inventory/transfers:
    post:
      tags: [Inventory]
      summary: Move stock between locations
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, fromLocationId, toLocationId, quantity]
              properties:
                productId: { type: string, format: uuid }
                fromLocationId: { type: string, format: uuid }
                toLocationId: { type: string, format: uuid }
                quantity: { type: number, exclusiveMinimum: 0 }
                reason: { type: string }
      responses:
        '201':
          description: Transferred (two paired movements)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockMovement' }
        '409': { $ref: '#/components/responses/InsufficientStock' }

  /stocktakes:
    post:
      tags: [Inventory]
      summary: Start a physical count
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId]
              properties:
                locationId: { type: string, format: uuid }
                reference: { type: string }
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stocktake' }

  /stocktakes/{stocktakeId}/lines:
    parameters:
      - name: stocktakeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Inventory]
      summary: Submit counted quantities (upsert, batchable for offline counts)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [productId, countedQty]
                properties:
                  productId: { type: string, format: uuid }
                  countedQty: { type: number, minimum: 0 }
                  note: { type: string }
      responses:
        '200':
          description: Saved, with computed variances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StocktakeLine' }

  /stocktakes/{stocktakeId}/complete:
    parameters:
      - name: stocktakeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Inventory]
      summary: Approve the count and post variance movements
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stocktake' }
        '409':
          description: Already completed
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------
  # Sales
  # ------------------------------------------------------------------
  /sales:
    get:
      tags: [Sales]
      summary: List sales
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string, enum: [draft, completed, partially_refunded, voided, refunded] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Sale' }
    post:
      tags: [Sales]
      summary: Record a sale
      description: |
        Atomic: the sale, its lines and one `sale` movement per line are written
        in a single transaction. If any line would oversell, the whole sale is
        rejected with 409 and nothing is persisted.

        `clientRequestId` in the body (or the `Idempotency-Key` header) makes a
        retry return the original sale rather than double-counting stock —
        essential when a phone loses signal mid-request.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleWriteRequest' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleDetail' }
        '200':
          description: Idempotent replay of an already-recorded sale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleDetail' }
        '409': { $ref: '#/components/responses/InsufficientStock' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /sales/{saleId}:
    parameters: [ { $ref: '#/components/parameters/SaleId' } ]
    get:
      tags: [Sales]
      summary: Get a sale with its lines
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sales/{saleId}/void:
    parameters: [ { $ref: '#/components/parameters/SaleId' } ]
    post:
      tags: [Sales]
      summary: Void a sale and return its stock
      description: Posts compensating `sale_return` movements. The original sale row is never deleted.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Voided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleDetail' }
        '409':
          description: Sale is not in a voidable state
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /sales/{saleId}/returns:
    parameters: [ { $ref: '#/components/parameters/SaleId' } ]
    post:
      tags: [Sales]
      summary: Return part of a sale
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                reason: { type: string }
                restock: { type: boolean, default: true, description: False for damaged goods }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: string, format: uuid }
                      quantity: { type: number, exclusiveMinimum: 0 }
      responses:
        '201':
          description: Return recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Sale is not in a returnable state, or a requested quantity exceeds
            what remains outstanding
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------
  # Purchasing
  # ------------------------------------------------------------------
  /purchase-orders:
    get:
      tags: [Purchasing]
      summary: List purchase orders
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [draft, ordered, partial, received, cancelled] }
        - name: supplierId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PurchaseOrder' }
    post:
      tags: [Purchasing]
      summary: Create a purchase order
      description: Pass `fromRecommendationIds` to build a PO straight from reorder advice.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderWriteRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrderDetail' }

  /purchase-orders/{poId}:
    parameters: [ { $ref: '#/components/parameters/PoId' } ]
    get:
      tags: [Purchasing]
      summary: Get a purchase order with its lines
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrderDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /purchase-orders/{poId}/submit:
    parameters: [ { $ref: '#/components/parameters/PoId' } ]
    post:
      tags: [Purchasing]
      summary: Mark the order as placed with the supplier
      description: Stamps `orderedAt`, which starts the lead-time clock for forecasting.
      responses:
        '200':
          description: Ordered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrderDetail' }

  /purchase-orders/{poId}/receipts:
    parameters: [ { $ref: '#/components/parameters/PoId' } ]
    post:
      tags: [Purchasing]
      summary: Receive stock against the order (supports partial deliveries)
      description: |
        Posts `purchase_receipt` movements and records an observed lead time,
        which feeds back into the supplier's average and variability.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                receivedAt: { type: string, format: date-time }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantityReceived]
                    properties:
                      productId: { type: string, format: uuid }
                      quantityReceived: { type: number, exclusiveMinimum: 0 }
                      unitCost: { type: number, minimum: 0 }
      responses:
        '201':
          description: Received
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrderDetail' }
        '409':
          description: Receipt exceeds ordered quantity, or order is cancelled
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------
  # Forecasting
  # ------------------------------------------------------------------
  /forecasts:
    get:
      tags: [Forecasting]
      summary: Current forecasts for all products
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/LocationIdQuery'
        - name: horizonDays
          in: query
          schema: { type: integer, default: 14, minimum: 1, maximum: 365 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Forecast' }

  /products/{productId}/forecast:
    parameters: [ { $ref: '#/components/parameters/ProductId' } ]
    get:
      tags: [Forecasting]
      summary: Forecast for one product, with the demand history behind it
      description: |
        Returns `method: insufficient_data` and a null `projectedStockoutOn`
        when there is too little history to be honest about — the app should
        show "still learning", not a confident number.
      parameters:
        - name: includeHistory
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/LocationIdQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForecastDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /forecasts/recompute:
    post:
      tags: [Forecasting]
      summary: Force a recompute (normally runs nightly)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                productIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: Omit to recompute the whole catalog
      responses:
        '202':
          description: Accepted; runs asynchronously
          content:
            application/json:
              schema:
                type: object
                required: [jobId, queuedProducts]
                properties:
                  jobId: { type: string, format: uuid }
                  queuedProducts: { type: integer }

  /reorder-recommendations:
    get:
      tags: [Forecasting]
      summary: What to reorder, how much, and why
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [open, ordered, dismissed, expired], default: open }
        - name: supplierId
          in: query
          description: Group a single order to one supplier
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ReorderRecommendation' }

  /reorder-recommendations/{recommendationId}/dismiss:
    parameters:
      - name: recommendationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Forecasting]
      summary: Dismiss a recommendation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '204': { description: Dismissed }

  # ------------------------------------------------------------------
  # Reports
  # ------------------------------------------------------------------
  /reports/dashboard:
    get:
      tags: [Reports]
      summary: Home screen summary
      description: |
        Owner and manager only. Every field below carries cost or margin, and
        `grossProfit` and `inventoryValue` are both required — so there is no
        redacted variant for a clerk or a viewer. See docs/adr/reporting.md §5.

        All money is **net of tax**, net of returns, and excludes voided sales.
        A shop owner comparing `salesTotal` with a till roll will see a smaller
        number, because the till roll includes VAT. Label it "net sales".
      parameters:
        - name: period
          in: query
          description: |
            A rolling window ending now, in the tenant's timezone: `today` is
            since local midnight, `week` the last 7 days, `month` the last 30.
            Not calendar periods — a calendar week makes Monday morning look
            like the business collapsed.

            Scopes `salesTotal`, `salesCount`, `grossProfit` and `topProducts`.
            Deliberately does NOT scope `salesTrend`.
          schema: { type: string, enum: [today, week, month], default: week }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }

  /reports/sales-summary:
    get:
      tags: [Reports]
      summary: Sales totals bucketed over time
      description: |
        Owner and manager only. `revenue` is the same figure as the dashboard's
        `salesTotal`, computed from the same SQL: ex-tax, net of returns, voided
        sales excluded. `grossProfit` uses the cost snapshotted on each sale
        line at sale time, so a later change to a product's cost price does not
        rewrite what a past period earned.

        Buckets with no sales are emitted as zeroes rather than omitted, so a
        chart does not draw a line between two non-adjacent days.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: groupBy
          in: query
          schema: { type: string, enum: [day, week, month], default: day }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [buckets]
                properties:
                  buckets:
                    type: array
                    items:
                      type: object
                      required: [periodStart, unitsSold, revenue]
                      properties:
                        periodStart: { type: string, format: date }
                        unitsSold: { type: number }
                        revenue: { type: number }
                        grossProfit: { type: number }

  /reports/inventory-valuation:
    get:
      tags: [Reports]
      summary: What the stock on hand is worth
      description: |
        Owner and manager only.

        **`asOf` replays the QUANTITIES but not the PRICES.** The quantity at a
        past date is exact — it is `SUM(quantity_delta)` over an append-only
        ledger, which is the same arithmetic `product_stock` performs, stopped
        early. The prices are not: `products.cost_price` and `selling_price`
        have no history in this schema, so a valuation `asOf` last March values
        last March's quantities at today's prices.

        That hybrid is deliberate and is stated here rather than left to be
        discovered. Costing a past date properly means choosing between
        weighted-average and FIFO over `stock_movements.unit_cost`, which
        changes reported profit permanently and is a decision rather than a
        query. See docs/adr/reporting.md §2.
      parameters:
        # NOT components/parameters/LocationIdQuery, which says it defaults to
        # the tenant's default location. That default was written for stock
        # listings; for a valuation it is a number that is wrong without saying
        # so, since a two-location shop asking what its stock is worth would be
        # told the worth of some of it.
        - name: locationId
          in: query
          description: Defaults to ALL locations, not the tenant's default one
          schema: { type: string, format: uuid }
        - name: asOf
          in: query
          description: |
            Valuation at a past date, replayed from the ledger. Defaults to
            today in the tenant's timezone, and is echoed back either way so a
            client never has to guess what "today" meant to the server. A
            future date is refused.
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [totalCostValue, totalRetailValue, productCount, asOf]
                properties:
                  totalCostValue: { type: number }
                  totalRetailValue: { type: number }
                  productCount: { type: integer }
                  asOf: { type: string, format: date }

  /reports/top-products:
    get:
      tags: [Reports]
      summary: Best and worst movers
      description: |
        Owner and manager only.

        **Ranked by `unitsSold`, not by revenue** — here and in the dashboard's
        `topProducts`, one key and never two. `revenue` and `grossMarginPct`
        are reported so both can be seen, but they are not the ordering.

        `order=worst` includes products that sold nothing at all, at
        `unitsSold: 0`; they are the worst movers, and an aggregate over sale
        lines cannot see them. `order=best` excludes them. See
        docs/adr/reporting.md §4.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: order
          in: query
          schema: { type: string, enum: [best, worst], default: best }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [productId, sku, name, unitsSold, revenue]
                  properties:
                    productId: { type: string, format: uuid }
                    sku: { type: string }
                    name: { type: string }
                    unitsSold: { type: number }
                    revenue: { type: number }
                    grossMarginPct: { type: number }

  # ------------------------------------------------------------------
  # Sync (offline support for the Android client)
  # ------------------------------------------------------------------
  /sync/changes:
    get:
      tags: [Sync]
      summary: Everything that changed since a watermark
      description: |
        Lets the app keep a local cache warm without refetching the catalog.
        Returns tombstones for deletions and a new `syncToken`.
        Sales created offline are pushed back through POST /sales with a
        `clientRequestId`, so replays are safe.

        **`syncToken` is opaque and is not a timestamp.** It encodes a position
        in a transaction-id clock, so it never ties, never moves backwards, and
        cannot loop. Store it verbatim and pass it back as `since`; do not parse
        it, compare two of them, or try to construct one. A token the server
        cannot read is answered with 400, and the recovery is to omit `since`
        and resynchronise from scratch.

        **Apply `deleted` as well as the upserts.** A product deleted while a
        device was offline stays sellable on that device until its tombstone is
        applied.

        **When `hasMore` is true, call again immediately** with the new token
        rather than waiting for the next sync interval — otherwise a large
        backlog drains one page per interval.

        Available to every role. It carries no sales, money, cost or margin; the
        report endpoints are owner/manager because they do.
      parameters:
        - name: since
          in: query
          description: Opaque token from the previous sync; omit for a full snapshot
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [syncToken, hasMore, products, categories, suppliers, locations, stock, deleted]
                properties:
                  syncToken: { type: string }
                  hasMore: { type: boolean }
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
                  suppliers:
                    type: array
                    items: { $ref: '#/components/schemas/Supplier' }
                  # Added in M8. The feed shipped without locations, which made
                  # it impossible for an offline client to know which locations
                  # exist -- and a sale needs one. StockStatus carries
                  # locationId and locationName, so the names leaked in through
                  # stock rows, but only for products that happened to change.
                  locations:
                    type: array
                    items: { $ref: '#/components/schemas/Location' }
                  stock:
                    type: array
                    description: |
                      Every location's row for any product whose stock moved.
                      Keyed on product rather than on the (product, location)
                      pair, because a tombstone carries one id.
                    items: { $ref: '#/components/schemas/StockStatus' }
                  deleted:
                    type: array
                    items:
                      type: object
                      required: [entityType, id]
                      properties:
                        entityType:
                          type: string
                          enum: [product, category, supplier, location, stock]
                        id: { type: string, format: uuid }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token, 15 minute TTL. Claims: `sub` (user id), `tid` (tenant id),
        `role`, `jti`. The server trusts `tid` from the signed token only.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
    IfMatch:
      name: If-Match
      in: header
      description: ETag from a prior GET; rejects a write over someone else's edit
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated UUID; a replay returns the original result
      schema: { type: string, format: uuid }
    LocationIdQuery:
      name: locationId
      in: query
      description: Defaults to the tenant's default location
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SaleId:
      name: saleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PoId:
      name: poId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing, expired or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but the role is not permitted
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |
        Not found in this tenant. Note that a resource belonging to another
        tenant also returns 404, never 403 — a 403 would confirm the id exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicts with existing state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: If-Match did not match; the resource changed underneath you
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Field-level validation errors
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InsufficientStock:
      description: The operation would drive stock negative
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/InsufficientStockProblem' }

  schemas:

    # A named schema, not an inline one under responses, and that distinction is
    # the whole point. Code generators emit types for components/schemas; an
    # inline schema under a response gets no type at all, so a client receiving
    # this 409 had productId, requested and available sitting in the body with
    # no way to reach them except by parsing the raw error itself.
    #
    # Found during M3: the generated Kotlin client had a `Problem` model with
    # none of these three fields and no InsufficientStock model whatsoever.
    # M2 went to some trouble to prove those numbers are populated and correct
    # (InsufficientStockHttpTest), which is wasted if the client cannot read
    # them.
    #
    # allOf Problem so the RFC 9457 fields are inherited rather than restated —
    # one definition of `status`, `title` and `detail`.
    InsufficientStockProblem:
      description: |
        A 409 from any endpoint that moves stock. Carries the numbers a cashier
        needs to act on: which product, how much was asked for, how much there
        actually is.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [productId, requested, available]
          properties:
            productId: { type: string, format: uuid }
            requested:
              type: number
              description: Absolute quantity requested, not the signed delta
            available:
              type: number
              description: Quantity on hand at the time of the refusal

    Problem:
      type: object
      description: RFC 9457 problem detail
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, examples: ['https://api.example.com/problems/insufficient-stock'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Page:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { type: object }
        nextCursor:
          type: string
          nullable: true
          description: Null when the last page has been reached

    UserRole:
      type: string
      enum: [owner, manager, clerk, viewer]
      description: |
        owner   – billing, users, everything
        manager – catalog, purchasing, reports, adjustments
        clerk   – record sales, receive stock, count
        viewer  – read only

    MovementType:
      type: string
      enum: [purchase_receipt, sale, sale_return, purchase_return, adjustment,
             stocktake, transfer_in, transfer_out, opening_balance]

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Access token TTL in seconds }
        tokenType: { type: string, examples: [Bearer] }
        user: { $ref: '#/components/schemas/CurrentUser' }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        tenantSlug: { type: string }
        deviceLabel: { type: string }

    TenantRegistrationRequest:
      type: object
      required: [businessName, slug, ownerEmail, ownerPassword, ownerName]
      properties:
        businessName: { type: string }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        ownerEmail: { type: string, format: email }
        ownerPassword: { type: string, format: password, minLength: 8 }
        ownerName: { type: string }
        currencyCode: { type: string, minLength: 3, maxLength: 3, default: ZAR }
        timezone: { type: string, default: UTC }

    TenantSummary:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }

    CurrentUser:
      type: object
      required: [id, email, fullName, role, tenant, currencyCode, timezone]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        tenant: { $ref: '#/components/schemas/TenantSummary' }
        currencyCode: { type: string }
        timezone: { type: string }
        # Registration now creates a "Main" location and this points at it, so
        # a freshly registered business has one. Still NOT required, and that is
        # not an oversight: tenants registered before that change have no
        # default location, and nothing stops the only one being deactivated
        # later. A client must handle its absence rather than assume the
        # happy-path shape holds for every account it will ever see.
        defaultLocationId: { type: string, format: uuid, nullable: true }

    User:
      type: object
      required: [id, email, fullName, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { type: string, enum: [invited, active, disabled] }
        lastLoginAt: { type: string, format: date-time, nullable: true }

    UserInviteRequest:
      type: object
      required: [email, fullName, role]
      properties:
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }

    Category:
      type: object
      required: [id, name, productCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parentId: { type: string, format: uuid, nullable: true }
        productCount: { type: integer }

    Location:
      type: object
      required: [id, name, isDefault, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string, nullable: true }
        isDefault: { type: boolean }
        isActive: { type: boolean }

    Product:
      type: object
      required: [id, sku, name, unitOfMeasure, costPrice, sellingPrice, taxRate, quantityOnHand, quantityAvailable, stockState, isActive, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        barcode: { type: string, nullable: true }
        name: { type: string }
        categoryId: { type: string, format: uuid, nullable: true }
        unitOfMeasure: { type: string }
        costPrice: { type: number }
        sellingPrice: { type: number }
        taxRate: { type: number }
        # quantityOnHand, quantityAvailable and stockState are NOT columns of
        # the product. They are summed across `product_stock`, which is a cache
        # maintained by the `apply_stock_movement` trigger — so they are derived
        # values that travel on the product for convenience.
        #
        # Two consequences a client must plan for:
        #
        #   * They are a total over every location. A product with 3 units at
        #     the front counter and 0 in the back room reports 3, and no single
        #     location has 3. Use StockStatus (GET /inventory) when the question
        #     is per-location.
        #   * They are correct as of the response and can be stale a moment
        #     later, because any sale, receipt or transfer moves them. Nothing
        #     in this schema distinguishes a fresh figure from a stale one, so a
        #     client must not treat quantityOnHand as authority for whether a
        #     sale will succeed. Post the sale; the ledger trigger decides, and
        #     a refusal comes back as InsufficientStockProblem carrying the real
        #     number.
        #
        # updatedAt is the PRODUCT row's timestamp, not the stock's — a sale
        # changes the quantity without changing updatedAt.
        quantityOnHand:
          type: number
          description: >-
            Total on hand across all locations, from the product_stock cache.
            Not authoritative for whether a sale will succeed — see the note above.
        quantityAvailable:
          type: number
          description: >-
            Total on hand less reserved, across all locations. Same provenance
            and same staleness as quantityOnHand.
        stockState:
          type: string
          enum: [ok, reorder, out_of_stock, unknown]
          description: >-
            Derived from the totals above against reorderPoint. `unknown` means
            no reorder point is set, not that the quantity is unknown.
        isActive: { type: boolean }
        updatedAt:
          type: string
          format: date-time
          description: >-
            When the PRODUCT row last changed. Stock movements do not touch it,
            so this is not a freshness signal for quantityOnHand.

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required: [allowNegativeStock, stockByLocation]
          properties:
            description: { type: string, nullable: true }
            reorderPoint: { type: number, nullable: true }
            reorderQuantity: { type: number, nullable: true }
            safetyStock: { type: number, nullable: true }
            allowNegativeStock: { type: boolean }
            stockByLocation:
              type: array
              items: { $ref: '#/components/schemas/StockStatus' }
            forecast:
              oneOf:
                - $ref: '#/components/schemas/Forecast'
                - type: 'null'
            preferredSupplier:
              oneOf:
                - $ref: '#/components/schemas/Supplier'
                - type: 'null'

    ProductWriteRequest:
      type: object
      required: [sku, name]
      properties:
        sku: { type: string, minLength: 1, maxLength: 64 }
        barcode: { type: string, nullable: true }
        name: { type: string, minLength: 1 }
        description: { type: string }
        categoryId: { type: string, format: uuid, nullable: true }
        unitOfMeasure: { type: string, default: each }
        costPrice: { type: number, minimum: 0 }
        sellingPrice: { type: number, minimum: 0 }
        taxRate: { type: number, minimum: 0, exclusiveMaximum: 1 }
        reorderPoint: { type: number, minimum: 0, nullable: true }
        reorderQuantity: { type: number, exclusiveMinimum: 0, nullable: true }
        safetyStock: { type: number, minimum: 0, nullable: true }
        isTracked: { type: boolean, default: true }
        allowNegativeStock: { type: boolean, default: false }
        openingStock:
          type: object
          description: Create-only; posts an opening_balance movement
          properties:
            locationId: { type: string, format: uuid }
            quantity: { type: number, minimum: 0 }
            unitCost: { type: number, minimum: 0 }

    Supplier:
      type: object
      required: [id, name, leadTimeDays, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        contactName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        leadTimeDays: { type: integer }
        minOrderValue: { type: number, nullable: true }
        isActive: { type: boolean }

    SupplierDetail:
      allOf:
        - $ref: '#/components/schemas/Supplier'
        - type: object
          required: [observedLeadTime, productCount]
          properties:
            address: { type: string, nullable: true }
            notes: { type: string, nullable: true }
            observedLeadTime:
              type: object
              description: Measured from actual receipts, not the promised figure
              required: [sampleSize]
              properties:
                averageDays: { type: number, nullable: true }
                stddevDays: { type: number, nullable: true }
                sampleSize: { type: integer }
                onTimeRate: { type: number, nullable: true }
            productCount: { type: integer }

    SupplierWriteRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        contactName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        address: { type: string }
        leadTimeDays: { type: integer, minimum: 0, maximum: 365, default: 7 }
        minOrderValue: { type: number, minimum: 0 }
        notes: { type: string }

    ProductSupplier:
      type: object
      required: [supplierId, supplierName, packSize, isPreferred]
      properties:
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        supplierSku: { type: string, nullable: true }
        unitCost: { type: number, nullable: true }
        packSize: { type: number }
        leadTimeDays: { type: integer, nullable: true }
        isPreferred: { type: boolean }

    ProductSupplierWrite:
      type: object
      required: [supplierId]
      properties:
        supplierId: { type: string, format: uuid }
        supplierSku: { type: string }
        unitCost: { type: number, minimum: 0 }
        packSize: { type: number, exclusiveMinimum: 0, default: 1 }
        leadTimeDays: { type: integer, minimum: 0 }
        isPreferred: { type: boolean, default: false }

    StockStatus:
      type: object
      required: [productId, sku, name, locationId, locationName, quantityOnHand, quantityReserved, quantityAvailable, stockState, updatedAt]
      properties:
        productId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        locationId: { type: string, format: uuid }
        locationName: { type: string }
        quantityOnHand: { type: number }
        quantityReserved: { type: number }
        quantityAvailable: { type: number }
        reorderPoint: { type: number, nullable: true }
        stockState: { type: string, enum: [ok, reorder, out_of_stock, unknown] }
        daysOfCover: { type: number, nullable: true }
        updatedAt: { type: string, format: date-time }

    StockMovement:
      type: object
      required: [id, productId, productName, locationId, movementType, quantityDelta, occurredAt]
      properties:
        id: { type: integer, format: int64 }
        productId: { type: string, format: uuid }
        productName: { type: string }
        locationId: { type: string, format: uuid }
        movementType: { $ref: '#/components/schemas/MovementType' }
        quantityDelta: { type: number, description: Signed; negative is stock out }
        balanceAfter: { type: number, nullable: true }
        unitCost: { type: number, nullable: true }
        referenceType: { type: string, nullable: true }
        referenceId: { type: string, format: uuid, nullable: true }
        reason: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid, nullable: true }
        createdByName: { type: string, nullable: true }

    AdjustmentRequest:
      type: object
      required: [productId, quantityDelta, reason]
      properties:
        productId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        quantityDelta:
          type: number
          description: Signed and non-zero. Use -2 for two damaged units.
        reason: { type: string, minLength: 1 }
        unitCost: { type: number, minimum: 0 }
        occurredAt: { type: string, format: date-time }

    Stocktake:
      type: object
      required: [id, locationId, startedAt, lineCount, totalVariance]
      properties:
        id: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        reference: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        lineCount: { type: integer }
        totalVariance: { type: number }

    StocktakeLine:
      type: object
      required: [productId, sku, name, expectedQty, countedQty, variance]
      properties:
        productId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        expectedQty: { type: number }
        countedQty: { type: number }
        variance: { type: number }
        note: { type: string, nullable: true }

    Sale:
      type: object
      required: [id, saleNumber, status, itemCount, subtotalAmount, discountAmount, taxAmount, totalAmount, soldAt]
      properties:
        id: { type: string, format: uuid }
        saleNumber: { type: string }
        status: { type: string, enum: [draft, completed, partially_refunded, voided, refunded] }
        customerName: { type: string, nullable: true }
        itemCount: { type: integer }
        subtotalAmount: { type: number }
        discountAmount: { type: number }
        taxAmount: { type: number }
        totalAmount: { type: number }
        paymentMethod: { type: string, nullable: true }
        soldAt: { type: string, format: date-time }

    SaleDetail:
      allOf:
        - $ref: '#/components/schemas/Sale'
        - type: object
          required: [locationId, createdBy, lines]
          properties:
            locationId: { type: string, format: uuid }
            createdBy: { type: string, format: uuid }
            createdByName: { type: string }
            lines:
              type: array
              items:
                type: object
                required: [productId, sku, name, quantity, unitPrice, discountAmount, lineTotal,
                           returnedQuantity, outstandingQuantity]
                properties:
                  productId: { type: string, format: uuid }
                  sku: { type: string }
                  name: { type: string }
                  quantity: { type: number }
                  unitPrice: { type: number }
                  discountAmount: { type: number }
                  taxRate: { type: number }
                  lineTotal: { type: number }
                  returnedQuantity:
                    type: number
                    description: Sum of restocked and damaged-goods returns against this line, from sale_returns
                  outstandingQuantity:
                    type: number
                    description: quantity minus returnedQuantity — what remains available to return

    SaleWriteRequest:
      type: object
      required: [lines]
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: Generate on the device before the first attempt, reuse on retry
        locationId: { type: string, format: uuid }
        customerName: { type: string }
        customerPhone: { type: string }
        paymentMethod: { type: string, examples: [cash, card, eft, mobile_money] }
        discountAmount: { type: number, minimum: 0, default: 0 }
        soldAt:
          type: string
          format: date-time
          description: Set by the client for sales captured offline; defaults to now
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string, format: uuid }
              quantity: { type: number, exclusiveMinimum: 0 }
              unitPrice:
                type: number
                minimum: 0
                description: Omit to use the product's current selling price
              discountAmount: { type: number, minimum: 0, default: 0 }

    PurchaseOrder:
      type: object
      required: [id, poNumber, supplierId, supplierName, status, totalAmount, lineCount]
      properties:
        id: { type: string, format: uuid }
        poNumber: { type: string }
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        status: { type: string, enum: [draft, ordered, partial, received, cancelled] }
        orderedAt: { type: string, format: date-time, nullable: true }
        expectedAt: { type: string, format: date, nullable: true }
        receivedAt: { type: string, format: date-time, nullable: true }
        totalAmount: { type: number }
        lineCount: { type: integer }

    PurchaseOrderDetail:
      allOf:
        - $ref: '#/components/schemas/PurchaseOrder'
        - type: object
          required: [locationId, lines]
          properties:
            locationId: { type: string, format: uuid }
            notes: { type: string, nullable: true }
            lines:
              type: array
              items:
                type: object
                required: [productId, sku, name, quantityOrdered, quantityReceived, quantityOutstanding, unitCost, lineTotal]
                properties:
                  productId: { type: string, format: uuid }
                  sku: { type: string }
                  name: { type: string }
                  quantityOrdered: { type: number }
                  quantityReceived: { type: number }
                  quantityOutstanding: { type: number }
                  unitCost: { type: number }
                  lineTotal: { type: number }

    PurchaseOrderWriteRequest:
      type: object
      required: [supplierId, lines]
      properties:
        supplierId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        expectedAt: { type: string, format: date }
        notes: { type: string }
        fromRecommendationIds:
          type: array
          items: { type: string, format: uuid }
          description: Marks those recommendations as 'ordered'
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantityOrdered]
            properties:
              productId: { type: string, format: uuid }
              quantityOrdered: { type: number, exclusiveMinimum: 0 }
              unitCost: { type: number, minimum: 0 }

    Forecast:
      type: object
      required: [productId, locationId, method, generatedAt, historyDays, avgDailyDemand, demandStddev, horizonDays, forecastQty, serviceLevel]
      properties:
        productId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        method:
          type: string
          enum: [moving_average, weighted_moving_average, exponential_smoothing,
                 croston, ml_model, insufficient_data]
        generatedAt: { type: string, format: date-time }
        historyDays: { type: integer }
        avgDailyDemand: { type: number }
        demandStddev: { type: number }
        horizonDays: { type: integer }
        forecastQty: { type: number }
        daysOfCover: { type: number, nullable: true }
        projectedStockoutOn: { type: string, format: date, nullable: true }
        reorderPoint: { type: number, nullable: true }
        serviceLevel: { type: number }
        confidence:
          type: number
          nullable: true
          description: 0–1. Low values mean thin or erratic history; show it in the UI.

    ForecastDetail:
      allOf:
        - $ref: '#/components/schemas/Forecast'
        - type: object
          required: [explanation, history]
          properties:
            explanation:
              type: string
              description: Plain-English rationale for the shop owner
              examples: ['You sell about 7.5 phones a week. 17 in stock covers roughly 16 days.']
            history:
              type: array
              description: Daily demand series; zero-demand days included on purpose
              items:
                type: object
                required: [day, unitsSold, hadStockout]
                properties:
                  day: { type: string, format: date }
                  unitsSold: { type: number }
                  hadStockout: { type: boolean }

    ReorderRecommendation:
      type: object
      required: [id, productId, sku, name, locationId, quantityOnHand, reorderPoint, recommendedQty, urgency, rationale, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        locationId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid, nullable: true }
        supplierName: { type: string, nullable: true }
        quantityOnHand: { type: number }
        reorderPoint: { type: number }
        recommendedQty: { type: number }
        estimatedCost: { type: number, nullable: true }
        projectedStockoutOn: { type: string, format: date, nullable: true }
        urgency: { type: string, enum: [critical, high, normal] }
        rationale: { type: string }
        status: { type: string, enum: [open, ordered, dismissed, expired] }
        createdAt: { type: string, format: date-time }

    DashboardSummary:
      type: object
      required: [period, salesTotal, salesCount, grossProfit, inventoryValue, lowStockCount, outOfStockCount, openRecommendationCount, salesTrend, topProducts]
      properties:
        period:
          type: string
          description: The window requested, echoed back
        salesTotal:
          type: number
          description: |
            Net sales over `period`: ex-tax, net of returns, voided sales
            excluded. NOT the till total, which includes tax.
        salesCount:
          type: integer
          description: |
            Non-voided sales in the window. A fully refunded sale still counts;
            it happened, and someone was served.
        grossProfit:
          type: number
          description: |
            `salesTotal` minus cost of goods, where cost is the price
            snapshotted onto each sale line at sale time. A later change to a
            product's cost price does not move this figure.
        inventoryValue:
          type: number
          description: |
            Current stock on hand at the CURRENT cost price — a statement about
            now, not a historical figure, and so not the same kind of number as
            `grossProfit`.
        lowStockCount:
          type: integer
          description: Products at or below their effective reorder point
        outOfStockCount:
          type: integer
        openRecommendationCount:
          type: integer
        salesTrend:
          type: array
          description: |
            **Always the last 14 days**, regardless of `period`. Fourteen so
            every weekday appears twice and a Saturday can be read against last
            Saturday; fixed, because `period=today` would otherwise produce a
            one-point "trend". Days with no sales are present, at zero.
          items:
            type: object
            required: [day, revenue]
            properties:
              day: { type: string, format: date }
              revenue: { type: number }
        topProducts:
          type: array
          description: |
            The top 5 over `period`, **ranked by unitsSold** — the same key
            GET /reports/top-products uses. Products that sold nothing are not
            listed here.
          items:
            type: object
            required: [productId, name, unitsSold]
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              unitsSold: { type: number }
