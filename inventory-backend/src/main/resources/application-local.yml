# Local development, against the `db` service in docker-compose.yml.
#
# Every value here is an environment variable with a local-only default. The
# defaults match docker-compose.yml so a fresh clone runs with no setup. They
# are not secrets and must never be reused anywhere real.

spring:
  datasource:
    # The application connects as inventory_app: NOSUPERUSER, NOBYPASSRLS, and
    # therefore actually subject to the RLS policies from V1.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_APP_USER:inventory_app}
    # @app.db.password@ is substituted at build time by the Boot parent's
    # resource filtering, from the single <app.db.password> property in pom.xml.
    # The literal must not be written here — the flyway-maven-plugin reads the
    # same property, and a second copy is how the two silently drift apart.
    password: ${DB_APP_PASSWORD:@app.db.password@}
    hikari:
      pool-name: inventory-app-pool
      maximum-pool-size: ${DB_POOL_MAX:10}

  flyway:
    # Migrations run as the schema owner, on a separate connection from the one
    # the application uses. This is the only place owner credentials appear.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    user: ${DB_MIGRATION_USER:inventory_owner}
    password: ${DB_MIGRATION_PASSWORD:local_dev_only}
    placeholders:
      # V2 substitutes this into CREATE ROLE ... PASSWORD. Same single source as
      # spring.datasource.password above, so the role is created with exactly the
      # password the application will connect with. The flyway-maven-plugin
      # declares the identical placeholder in pom.xml for the CLI path.
      appUserPassword: ${DB_APP_PASSWORD:@app.db.password@}
      # Likewise for V3's inventory_login role, paired with
      # app.datasource.login.password below. Both Flyway configurations must
      # carry this placeholder — see CLAUDE.md section 9. Adding it here only
      # would leave `./mvnw flyway:migrate` failing to parse V3, and it would
      # fail only against an empty schema.
      loginUserPassword: ${DB_LOGIN_PASSWORD:@app.login.password@}

# The second pool. Deliberately NOT under spring.datasource — that prefix names
# the application's primary datasource, and a second entry there would be bound
# by Boot's autoconfiguration rather than by DataSourceConfig.
#
# This connects as inventory_login (V3): SELECT on tenants and users only, with
# a per-role policy letting it read them unscoped. It exists so login can answer
# "which tenant does this email belong to?" before app.tenant_id is known, and
# it must never be used for anything else.
app:
  datasource:
    login:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
      username: ${DB_LOGIN_USER:inventory_login}
      # Same build-time filtering as the app password above, from the single
      # <app.login.password> property in pom.xml.
      password: ${DB_LOGIN_PASSWORD:@app.login.password@}
      hikari:
        pool-name: inventory-login-pool
        # Login lookups are short and rare compared with application traffic;
        # this pool exists for a single query per authentication attempt.
        maximum-pool-size: ${DB_LOGIN_POOL_MAX:4}

  auth:
    # Local-only default, and long enough to satisfy the HS256 minimum. Prod has
    # no default at all — see application-prod.yml. Forging this key means
    # forging the tid claim, which is the whole of tenant isolation.
    signing-key: ${JWT_SIGNING_KEY:local-development-signing-key-not-a-secret-32b+}
    issuer: inventory-backend
    ttl:
      access: 15m
      refresh: 30d
    rate-limit:
      registrations-per-hour: ${AUTH_REGISTRATIONS_PER_HOUR:5}
      login-attempts-per-minute: ${AUTH_LOGIN_ATTEMPTS_PER_MINUTE:10}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: info
