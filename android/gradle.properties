org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official

# AGP 9 refuses Provider instances in the Android SourceSet API, steering you to
# Variant.sources.addGeneratedSourceDirectory. That wants a task exposing a
# DirectoryProperty, and openApiGenerate exposes outputDir as Property<String> —
# so it cannot be wired that way without an intermediate copy task.
#
# AGP's own documented opt-out is used instead. Its warning is that task
# dependencies are no longer inferred, which is handled explicitly in
# app/build.gradle.kts: both the Kotlin compile and the KSP tasks dependOn
# openApiGenerate, so generation always precedes compilation. Verified by
# building from clean.
android.sourceset.disallowProvider=false
